<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Akka’s Kitchen – Made with Love. Delivered on Time.</title>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0b6b2e;--g2:#22b14c;--lt:#effaf2;--tx:#16361f;--line:#cfeed8;--sc:'Kaushan Script','Brush Script MT',cursive}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:#fff;color:var(--tx);font:400 16px/1.6 Nunito,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{margin:0 0 .4em;color:var(--g);line-height:1.15}h2{font:400 clamp(28px,4vw,40px) var(--sc);text-align:center}
.w{max-width:1160px;margin:auto;padding:0 20px}section{padding:50px 0}.sub{text-align:center;margin:-4px 0 26px;font-weight:600}
a{color:inherit}.btn{display:inline-block;padding:13px 26px;border-radius:99px;background:var(--g);color:#fff;font:800 16px Nunito;text-decoration:none;border:2px solid var(--g);cursor:pointer}
.btn.o{background:#fff;color:var(--g)}.btn.w2{background:#fff;color:var(--g);border-color:#fff}
:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
nav{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 14px #0b6b2e1f;padding-top:env(safe-area-inset-top,0)}
nav .w{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap}
.br{display:flex;align-items:center;gap:8px;text-decoration:none;font:400 30px var(--sc);color:var(--g)}.br img{height:52px;width:52px;object-fit:cover;border-radius:50%}
nav .l{display:flex;gap:6px;flex:1;justify-content:center;overflow-x:auto}nav .l a{padding:7px 14px;border-radius:99px;text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
nav .l a:hover,nav .l a.on{background:var(--g);color:#fff}@media(max-width:860px){nav .l{order:3;flex-basis:100%;justify-content:flex-start;padding-bottom:8px}nav .btn{margin-left:auto}}
.hero{background:radial-gradient(circle at 10% 20%,#c9f2d4,transparent 45%),radial-gradient(circle at 60% 90%,#e3f9d0,transparent 40%),#fff;padding:36px 0 0}
.hero .w{display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-items:center}@media(max-width:860px){.hero .w{grid-template-columns:1fr}}
.hero h1{font:400 clamp(40px,6vw,66px) var(--sc);color:var(--tx);margin:0}.hero h1 em{display:block;color:var(--g);font-size:1.25em;font-style:normal}
.hero p.s{font:600 20px/1.5 Nunito;max-width:30ch;margin:14px 0 20px}.hero .bt{display:flex;gap:12px;flex-wrap:wrap}
.hero img.h{width:100%;border-radius:36px 0 0 90px;display:block;box-shadow:0 18px 40px #0b6b2e33}
.fe{display:flex;gap:18px;flex-wrap:wrap;margin:26px 0 30px;font-weight:800;font-size:13px;line-height:1.25}.fe div{text-align:center;flex:1;min-width:80px}.fe span{display:block;font-size:26px}
.ban{background:var(--g2);color:#fff;text-align:center;padding:12px;font-weight:800}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:16px}
.cat{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px #0b6b2e22;text-align:center;text-decoration:none;transition:transform .2s}.cat:hover{transform:translateY(-5px)}
.cat img{width:100%;height:112px;object-fit:cover;display:block}.cat b{display:block;padding-top:10px;font-size:17px}.cat small{display:block;padding:0 8px;color:#4f6b57}.cat i{display:block;padding:6px 0 12px;font-style:normal;font-weight:800;font-size:14px;color:var(--g)}
.sb{background:linear-gradient(180deg,#effaf2,#fff)}.sg{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:center}@media(max-width:980px){.sg{grid-template-columns:1fr}}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}
.p{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;position:relative;box-shadow:0 6px 16px #0b6b2e1a;display:flex;flex-direction:column;gap:2px}
.p .e{font-size:28px}.p b{font-size:15px}.p .pr{font:800 26px Nunito;color:var(--g)}.p small{font-size:12px;color:#4f6b57}.p a{margin-top:8px;padding:7px;font-size:13px}
.p.top{background:linear-gradient(180deg,#d7f7a8,#9be37f);border-color:var(--g2);transform:scale(1.04)}.p.top::before{content:"Most Popular";position:absolute;top:-12px;right:-6px;background:var(--g);color:#fff;font-size:12px;font-weight:800;padding:3px 12px;border-radius:99px;transform:rotate(6deg)}
.why{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 24px #0b6b2e26;position:relative;overflow:hidden}.why h3{font:400 26px var(--sc)}.why ul{list-style:none;padding:0;margin:0 0 14px;font-weight:800}.why li::before{content:"✔";color:#fff;background:var(--g);border-radius:50%;display:inline-grid;place-items:center;width:20px;height:20px;font-size:11px;margin-right:9px}
.why img{position:absolute;right:-6px;bottom:0;height:150px}.why p{max-width:60%;font-size:13px;margin:0 0 12px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-bottom:18px}
.d{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--tx);font:800 16px Nunito;cursor:pointer;position:relative}.d.on{background:var(--g2);color:#fff;border-color:var(--g2)}.d.sp::after{content:"★";position:absolute;top:2px;right:6px;font-size:11px;color:var(--g)}.d.on.sp::after{color:#fff}
.meals{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 16px #0b6b2e14}
.meals .card{border-top:6px solid var(--g2);animation:pop .3s}@keyframes pop{from{opacity:.3;transform:scale(.97)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.meals h3{font-size:18px}.meals p{margin:0;font-weight:700}.t{color:#4f6b57;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.chips span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700}.chips b{color:var(--g)}
.al{background:var(--lt)}.rv{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:center}@media(max-width:860px){.rv{grid-template-columns:1fr}}
.rv img{width:100%;border-radius:22px;display:block}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:800}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:800px){.ct{grid-template-columns:1fr}}
form{display:grid;gap:12px}input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);font:inherit;color:var(--tx);background:#fff}
footer{background:linear-gradient(135deg,#0b6b2e,#1a9a43);color:#e8fff0;padding:36px 0 18px}footer .g{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:24px}@media(max-width:800px){footer .g{grid-template-columns:1fr 1fr}}
footer h4{margin:0 0 8px;color:#fff;font-size:16px}footer a{display:block;text-decoration:none;font-size:14px;margin:3px 0}footer .br{color:#fff}
footer .cp{border-top:1px solid #ffffff44;margin-top:22px;padding-top:12px;text-align:center;font-size:13px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#25D366;color:#fff;border-radius:99px;padding:13px 20px;font-weight:800;text-decoration:none;box-shadow:0 8px 24px #0004}
</style></head><body>
