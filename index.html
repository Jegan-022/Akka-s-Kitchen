<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akka’s Kitchen – Made with Love. Delivered on Time.</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--g1:#0b9a3e;--g2:#22b14c;--bg:#fff;--card:#fff;--tx:#17361f;--gold:#fff;--mut:#4f6b57;--line:#cfeed8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5em;color:var(--g1)}
a{color:inherit}.w{max-width:1100px;margin:auto;padding:0 20px}section{padding:64px 0}
nav{position:sticky;top:0;z-index:20;background:#0b9a3e;color:#fff}
nav .w{display:flex;align-items:center;gap:16px;height:60px}nav img{height:40px;width:40px;border-radius:50%;background:#fff}
nav b{font-family:Caveat,cursive;font-size:26px;flex:1}nav a{text-decoration:none;font-weight:600;font-size:14px}
nav .l{display:flex;gap:18px}@media(max-width:760px){nav .l{display:none}}
.btn{display:inline-block;padding:12px 24px;border-radius:99px;background:var(--gold);color:var(--g1);font-weight:800;text-decoration:none;border:0;cursor:pointer;font:800 15px Nunito,sans-serif}
.btn.o{background:none;border:2px solid currentColor;color:#fff}.btn.g{background:var(--g2);color:#fff}
.hero{background:linear-gradient(135deg,#0b9a3e,#47d36b);color:#fff;position:relative;overflow:hidden;padding:56px 0}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}@media(max-width:800px){.hero .w{grid-template-columns:1fr}}
.hero h1{color:#fff;font-size:clamp(38px,6vw,64px);font-weight:800}.hero p{font-size:18px;max-width:46ch}
.hero .tag{font-family:Caveat,cursive;font-size:28px;color:#eaffd8}
.logo{background:#fff;border-radius:50%;padding:8px;max-width:380px;width:100%;margin:auto;display:block;box-shadow:0 20px 50px #0005;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(1deg)}}@media(prefers-reduced-motion:reduce){.logo{animation:none}}
.leaf{position:absolute;width:260px;height:260px;border-radius:0 100% 0 100%;background:#ffffff12;right:-60px;bottom:-60px;transform:rotate(20deg)}
.ban{background:#d9f5e2;color:#0b7a33;text-align:center;padding:14px;font-weight:800}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.card .e{font-size:34px}.price{font:800 30px Fraunces,serif;color:var(--g2)}
.time{color:var(--mut);font-size:14px}
.sub{color:var(--mut);max-width:60ch;margin-bottom:28px}
.alt{background:#effaf2}
/* planner */
.pl{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.pl{grid-template-columns:1fr}}
.chk{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.chk label{flex:1;min-width:100px;text-align:center;border:2px solid var(--line);border-radius:16px;padding:14px 8px;cursor:pointer;font-weight:800;background:var(--bg)}
.chk input{display:none}.chk label:has(input:checked){background:var(--g2);color:#fff;border-color:var(--g2)}
.chk label:has(input:focus-visible),.d:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #22b14c;outline-offset:2px}
.tot{font:800 44px Fraunces,serif;color:var(--g1)}.save{display:inline-block;background:#e3f8ea;color:#0b7a33;border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.tw{overflow-x:auto}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-bottom:18px}
.d{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--tx);font:800 16px Nunito;cursor:pointer;position:relative}
.d.on{background:var(--g1);color:#fff;border-color:var(--g1)}.d.sp::after{content:"★";position:absolute;top:2px;right:6px;font-size:11px;color:#c99a2e}
.meals{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.meals .card{border-top:6px solid var(--g2);animation:pop .3s}@keyframes pop{from{opacity:.3;transform:scale(.97)}}
.meals h3{font-size:18px}.meals p{margin:0;font-weight:600}
.how{counter-reset:s}.how .card{position:relative;padding-top:50px}.how .card::before{counter-increment:s;content:counter(s);position:absolute;top:-16px;left:20px;width:44px;height:44px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font:800 20px Fraunces}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:800}
.fr{background:linear-gradient(135deg,#0b9a3e,#2fc15a);color:#fff}.fr h2{color:var(--gold)}.fr .card{background:#ffffff22;border-color:#ffffff44}
form{display:grid;gap:12px}input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);font:inherit;background:var(--bg);color:var(--tx)}
footer{background:#0b9a3e;color:#eafff0;padding:36px 0;font-size:14px}footer b{color:var(--gold)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#25D366;color:#fff;border-radius:99px;padding:13px 20px;font-weight:800;text-decoration:none;box-shadow:0 8px 24px #0004}
</style></head><body>
